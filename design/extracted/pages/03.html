<title>Masuk Tani Muda, versi HP</title>
<script src="cb3bb19c-9afd-481e-b0ba-4eb96ee2dcd1"></script>
<style>/* Tani Muda — gaya komponen. Semua nilai diambil dari tokens.css. */
body { margin: 0; font-family: var(--font-sans); font-size: 16px; line-height: 24px; color: var(--teks); background: var(--embun-pagi); -webkit-font-smoothing: antialiased; }
.tm-ikon { display: block; flex: none; }
.tm-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Tombol */
.tm-tombol { box-sizing: border-box; display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2); min-height: var(--tinggi-kontrol); min-width: var(--target-sentuh); padding: 0 var(--space-5); border: 2px solid transparent; border-radius: var(--radius-md); font: inherit; font-size: 16px; line-height: 24px; font-weight: 600; text-align: center; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.tm-tombol--utama { background: var(--daun-tua); color: var(--putih); }
.tm-tombol--utama:hover, .tm-tombol--utama:active { background: var(--daun-tekan); }
.tm-tombol--sekunder { background: var(--putih); color: var(--daun-tua); border-color: var(--daun-tua); }
.tm-tombol--sekunder:hover, .tm-tombol--sekunder:active { background: var(--daun-lembut); }
.tm-tombol:active { transform: translateY(1px); }
.tm-tombol:focus-visible { outline: 2px solid transparent; box-shadow: var(--cincin-fokus); }
.tm-tombol:disabled { background: var(--garis); border-color: var(--garis); color: var(--teks-pendukung); cursor: not-allowed; transform: none; }
.tm-tombol--penuh { display: flex; width: 100%; }

/* Kartu */
.tm-kartu { background: var(--putih); border: 1px solid var(--garis); border-radius: var(--radius-lg); overflow: hidden; }
.tm-kartu__kepala { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--space-3); padding: var(--space-4) var(--space-4) 0; }
.tm-kartu__judulblok { min-width: 0; }
.tm-kartu__judul { margin: 0; font-size: 18px; line-height: 26px; font-weight: 600; color: var(--teks); }
.tm-kartu__keterangan { margin: var(--space-1) 0 0; font-size: 16px; line-height: 22px; color: var(--teks-pendukung); }
.tm-kartu__kanan { flex: none; }
.tm-kartu__isi { padding: var(--space-4); }
.tm-kartu__isi--rapat { padding: var(--space-2) 0; }
.tm-kartu__kaki { display: flex; flex-wrap: wrap; gap: var(--space-3) var(--space-6); padding: var(--space-3) var(--space-4); border-top: 1px solid var(--garis); }
.tm-kartu__kaki--uang { background: var(--tanah-lembut); border-top-color: var(--tanah-lembut); }

/* Kolom isian dan input rupiah */
.tm-kolom { display: flex; flex-direction: column; gap: var(--space-2); }
.tm-kolom__label { font-size: 16px; line-height: 24px; font-weight: 500; color: var(--teks); }
.tm-kolom__bingkai { box-sizing: border-box; display: flex; align-items: stretch; min-height: var(--tinggi-kontrol); background: var(--putih); border: 1.5px solid var(--garis-kuat); border-radius: var(--radius-md); overflow: hidden; }
.tm-kolom__bingkai:focus-within { border-color: var(--daun-tua); box-shadow: var(--cincin-fokus); }
.tm-kolom__input { flex: 1; min-width: 0; border: 0; margin: 0; background: transparent; font: inherit; font-size: 16px; line-height: 24px; color: var(--teks); padding: 0 var(--space-4); outline: none; }
.tm-kolom__input::placeholder { color: var(--teks-pendukung); opacity: 1; }
.tm-kolom__akhiran { display: flex; align-items: center; padding: 0 var(--space-4) 0 0; color: var(--teks-pendukung); font-weight: 500; }
.tm-kolom__bantuan { margin: 0; font-size: 16px; line-height: 22px; color: var(--teks-pendukung); }
.tm-kolom__galat { display: flex; gap: var(--space-2); align-items: flex-start; margin: 0; font-size: 16px; line-height: 22px; font-weight: 500; color: var(--tomat); }
.tm-kolom__galat .tm-ikon { margin-top: 1px; }
.tm-kolom--galat .tm-kolom__bingkai { border-color: var(--tomat); border-width: 2px; }
.tm-rupiah__awalan { display: flex; align-items: center; padding: 0 var(--space-3) 0 var(--space-4); background: var(--tanah-lembut); color: var(--tanah); font-weight: 600; font-size: 18px; border-right: 1px solid var(--garis); }
.tm-rupiah__input { font-size: 20px; line-height: 28px; font-weight: 600; color: var(--tanah); font-variant-numeric: tabular-nums; padding-left: var(--space-3); }
.tm-rupiah__input::placeholder { font-weight: 400; }

/* Uang */
.tm-uang { font-variant-numeric: tabular-nums; }
.tm-uang--berlabel { display: inline-flex; flex-direction: column; gap: 2px; }
.tm-uang__label { font-size: 16px; line-height: 22px; color: var(--teks-pendukung); }
.tm-uang__angka { color: var(--tanah); font-weight: 600; white-space: nowrap; }
.tm-uang__angka--besar { font-size: 20px; line-height: 28px; }
.tm-uang__angka--rugi { color: var(--tomat); }
.tm-uang__keterangan { font-size: 16px; line-height: 22px; color: var(--teks-pendukung); }

/* Chip status */
.tm-chip { box-sizing: border-box; display: inline-flex; align-items: center; gap: var(--space-2); min-height: 34px; padding: 0 var(--space-3); border: 1.5px solid transparent; border-radius: var(--radius-full); font-size: 16px; line-height: 22px; font-weight: 500; white-space: nowrap; vertical-align: middle; }
.tm-chip__titik { width: 10px; height: 10px; border-radius: var(--radius-full); background: currentColor; flex: none; }
.tm-chip--selesai { background: var(--daun-lembut); color: var(--daun-tua); }
.tm-chip--hari-ini { background: var(--putih); color: var(--daun-tua); border: 2px solid var(--daun-tua); }
.tm-chip--besok { background: var(--matahari-lembut); color: var(--matahari-teks); border-color: var(--matahari); }
.tm-chip--terlambat { background: var(--tomat-lembut); color: var(--tomat-teks); border-color: var(--tomat); }
.tm-chip--uang-muka-ditahan { background: var(--tanah-lembut); color: var(--tanah); }
.tm-chip--menunggu-konfirmasi { background: var(--putih); color: var(--teks-pendukung); border-color: var(--garis-kuat); }
.tm-chip--dana-cair { background: var(--daun-tua); color: var(--putih); }

/* Baris tugas */
.tm-tugas { box-sizing: border-box; display: flex; align-items: center; gap: var(--space-2); min-height: 72px; padding: var(--space-2) var(--space-3) var(--space-2) var(--space-1); background: var(--putih); }
.tm-tugas + .tm-tugas { border-top: 1px solid var(--garis); }
.tm-tugas__centang { flex: none; display: grid; place-items: center; width: var(--target-sentuh); height: var(--target-sentuh); padding: 0; border: 0; background: none; border-radius: var(--radius-full); cursor: pointer; -webkit-tap-highlight-color: transparent; }
.tm-tugas__lingkaran { box-sizing: border-box; display: grid; place-items: center; width: 30px; height: 30px; border: 2px solid var(--garis-kuat); border-radius: var(--radius-full); background: var(--putih); color: var(--putih); }
.tm-tugas__centang:hover .tm-tugas__lingkaran { border-color: var(--daun-tua); }
.tm-tugas--selesai .tm-tugas__lingkaran { background: var(--daun-tua); border-color: var(--daun-tua); }
.tm-tugas__centang:focus-visible, .tm-tugas__kamera:focus-visible { outline: 2px solid transparent; box-shadow: var(--cincin-fokus); }
.tm-tugas__teks { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: var(--space-1); padding: var(--space-1) 0; }
.tm-tugas__judul { font-size: 16px; line-height: 24px; font-weight: 600; color: var(--teks); }
.tm-tugas--selesai .tm-tugas__judul { color: var(--teks-pendukung); font-weight: 500; }
.tm-tugas__meta { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2) var(--space-3); font-size: 16px; line-height: 22px; color: var(--teks-pendukung); }
.tm-tugas__kamera { box-sizing: border-box; position: relative; flex: none; display: grid; place-items: center; width: var(--target-sentuh); height: var(--target-sentuh); padding: 0; border: 1.5px solid var(--garis-kuat); border-radius: var(--radius-sm); background: var(--putih); color: var(--teks); cursor: pointer; }
.tm-tugas__kamera:hover { border-color: var(--daun-tua); color: var(--daun-tua); }
.tm-tugas__jumlah { box-sizing: border-box; position: absolute; top: -9px; right: -9px; min-width: 26px; height: 26px; padding: 0 6px; border: 2px solid var(--putih); border-radius: var(--radius-full); background: var(--daun-tua); color: var(--putih); font-size: 16px; line-height: 22px; font-weight: 600; text-align: center; }

/* Penggaris Umur Tanam */
.tm-penggaris { position: relative; }
.tm-penggaris__grafik { position: relative; width: 100%; }
.tm-penggaris__jalur { position: absolute; border-radius: var(--radius-full); background: var(--garis); overflow: hidden; }
.tm-penggaris__isi { position: absolute; left: 0; top: 0; bottom: 0; background: var(--daun-tua); }
.tm-penggaris__tik { position: absolute; width: 2px; height: 6px; border-radius: 1px; background: var(--garis-kuat); }
.tm-penggaris__penanda { position: absolute; width: 4px; border-radius: 2px; background: var(--teks); }
.tm-penggaris__hariini { box-sizing: border-box; position: absolute; height: 32px; padding: 0 var(--space-3); border-radius: var(--radius-full); background: var(--teks); color: var(--putih); font-size: 16px; line-height: 32px; font-weight: 600; white-space: nowrap; font-variant-numeric: tabular-nums; }
.tm-penggaris__ujung { position: absolute; font-size: 16px; line-height: 22px; color: var(--teks-pendukung); white-space: nowrap; font-variant-numeric: tabular-nums; }
.tm-penggaris__tangkai { position: absolute; width: 2px; margin-left: -1px; background: var(--garis-kuat); }
.tm-penggaris__tangkai--selesai { background: var(--daun-tua); }
.tm-penggaris__tangkai--besok { background: var(--matahari); }
.tm-penggaris__tangkai--terlambat { background: var(--tomat); }
.tm-penggaris__tangkai--panen { background: var(--tanah); }
.tm-penggaris__labelpin { position: absolute; display: flex; flex-direction: column; white-space: nowrap; }
.tm-penggaris__namapin { font-size: 16px; line-height: 24px; font-weight: 600; color: var(--teks); }
.tm-penggaris__kalimat { font-size: 16px; line-height: 22px; color: var(--teks-pendukung); font-variant-numeric: tabular-nums; }
.tm-penggaris__kalimat--selesai { color: var(--daun-tua); }
.tm-penggaris__kalimat--besok { color: var(--matahari-teks); font-weight: 500; }
.tm-penggaris__kalimat--terlambat { color: var(--tomat); font-weight: 500; }
.tm-penggaris__kalimat--panen { color: var(--tanah); }
.tm-penggaris__daftar { list-style: none; margin: var(--space-4) 0 0; padding: var(--space-3) 0 0; border-top: 1px solid var(--garis); display: grid; gap: var(--space-2); }
.tm-penggaris__daftar li { display: flex; align-items: center; flex-wrap: wrap; gap: 0 var(--space-3); min-height: 32px; }
.tm-penggaris__daftar .tm-pin { margin-right: 0; }
.tm-pin { box-sizing: border-box; display: grid; place-items: center; flex: none; border-radius: var(--radius-full); }
.tm-pin--selesai { background: var(--daun-tua); color: var(--putih); }
.tm-pin--besok { background: var(--matahari-lembut); border: 3px solid var(--matahari); color: var(--matahari-teks); }
.tm-pin--belum { background: var(--putih); border: 2px solid var(--garis-kuat); }
.tm-pin--terlambat { background: var(--tomat-lembut); border: 2.5px solid var(--tomat); color: var(--tomat-teks); }
.tm-pin--panen { background: var(--putih); border: 3px solid var(--tanah); color: var(--tanah); }

/* Banner */
.tm-banner { box-sizing: border-box; display: flex; align-items: flex-start; gap: var(--space-3); padding: var(--space-3) var(--space-4); border: 1.5px solid; border-radius: var(--radius-md); color: var(--teks); }
.tm-banner__ikon { margin-top: 0; }
.tm-banner__teks { flex: 1; min-width: 0; }
.tm-banner__judul { margin: 0; font-size: 16px; line-height: 24px; font-weight: 600; }
.tm-banner__isi { margin: 2px 0 0; font-size: 16px; line-height: 22px; }
.tm-banner__aksi { display: inline-flex; align-items: center; min-height: var(--target-sentuh); margin: 0 0 -12px -8px; padding: 0 var(--space-2); border: 0; background: none; font: inherit; font-size: 16px; line-height: 24px; font-weight: 600; color: inherit; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; border-radius: var(--radius-sm); }
.tm-banner__aksi:focus-visible { outline: 2px solid transparent; box-shadow: var(--cincin-fokus); }
.tm-banner--peringatan { background: var(--matahari-lembut); border-color: var(--matahari); }
.tm-banner--peringatan .tm-banner__ikon { color: var(--matahari-teks); }
.tm-banner--bahaya { background: var(--tomat-lembut); border-color: var(--tomat); }
.tm-banner--bahaya .tm-banner__ikon, .tm-banner--bahaya .tm-banner__judul { color: var(--tomat-teks); }
.tm-banner--offline { padding: var(--space-3) var(--space-4); background: var(--teks); border-color: var(--teks); border-radius: var(--radius-sm); color: var(--putih); }
.tm-banner--offline .tm-banner__aksi:focus-visible { box-shadow: none; outline: 2px solid var(--putih); outline-offset: -2px; }

/* Navigasi bawah */
.tm-nav { box-sizing: border-box; display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--space-1); padding: var(--space-2) var(--space-2) calc(var(--space-2) + env(safe-area-inset-bottom, 0px)); background: var(--putih); border-top: 1px solid var(--garis); }
.tm-nav__item { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--space-1); min-height: 64px; padding: var(--space-1) 0; border: 0; background: none; border-radius: var(--radius-md); font: inherit; font-size: 16px; line-height: 20px; font-weight: 500; color: var(--teks-pendukung); cursor: pointer; -webkit-tap-highlight-color: transparent; }
.tm-nav__ikon { position: relative; display: grid; place-items: center; width: 56px; height: 32px; border-radius: var(--radius-full); }
.tm-nav__item[aria-current="page"] { color: var(--daun-tua); font-weight: 600; }
.tm-nav__item[aria-current="page"] .tm-nav__ikon { background: var(--daun-lembut); }
.tm-nav__item:focus-visible { outline: 2px solid transparent; box-shadow: var(--cincin-fokus); }
.tm-nav__lencana { box-sizing: border-box; position: absolute; top: -6px; left: 34px; min-width: 24px; height: 24px; padding: 0 5px; border: 2px solid var(--putih); border-radius: var(--radius-full); background: var(--teks); color: var(--putih); font-size: 16px; line-height: 20px; font-weight: 600; text-align: center; }

/* Pembantu untuk pratinjau */
.tm-pratinjau { padding: var(--space-4); display: flex; flex-wrap: wrap; gap: var(--space-3); align-items: center; }
.tm-pratinjau--kolom { flex-direction: column; align-items: stretch; }
.tm-hp { width: 360px; max-width: 100%; box-sizing: border-box; }
</style>
