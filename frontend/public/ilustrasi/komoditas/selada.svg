<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="Selada keriting">
  <title>Selada Keriting</title>
  <defs>
    <radialGradient id="selada-bayang" cx="50%" cy="50%" r="50%">
      <stop offset="0.00" stop-color="rgba(46,53,71,.30)"/>
      <stop offset="1.00" stop-color="rgba(46,53,71,0)"/>
    </radialGradient>
    <linearGradient id="selada-daun-gelap" x1="0" y1="1" x2="0.3" y2="0">
      <stop offset="0.00" stop-color="#216E1F"/>
      <stop offset="0.60" stop-color="#3FA628"/>
      <stop offset="1.00" stop-color="#76D63E"/>
    </linearGradient>
    <linearGradient id="selada-daun-sedang" x1="0" y1="1" x2="0.2" y2="0">
      <stop offset="0.00" stop-color="#348C21"/>
      <stop offset="0.50" stop-color="#5EBE2F"/>
      <stop offset="1.00" stop-color="#A5F04D"/>
    </linearGradient>
    <linearGradient id="selada-daun-terang" x1="0" y1="1" x2="0.1" y2="0">
      <stop offset="0.00" stop-color="#4CB026"/>
      <stop offset="0.60" stop-color="#7FE638"/>
      <stop offset="1.00" stop-color="#D2FF70"/>
    </linearGradient>
    <linearGradient id="selada-pangkal" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0.00" stop-color="#E2F5D0"/>
      <stop offset="1.00" stop-color="#99DC52"/>
    </linearGradient>
    <filter id="selada-halus" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#144010" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Bayangan lantai -->
  <ellipse cx="120" cy="214" rx="74" ry="11" fill="url(#selada-bayang)"/>
  <ellipse cx="120" cy="207" rx="28" ry="5.5" fill="#583B1E" opacity=".4"/>

  <!-- Kelopak luar selada (lapisan belakang) -->
  <g filter="url(#selada-halus)">
    <!-- Daun belakang kiri -->
    <path d="M120 200 C80 195 52 165 48 135 C44 110 60 92 82 86 C98 82 110 94 120 110 C108 145 112 180 120 200 Z" fill="url(#selada-daun-gelap)"/>
    <!-- Daun belakang kanan -->
    <path d="M120 200 C160 195 188 165 192 135 C196 110 180 92 158 86 C142 82 130 94 120 110 C132 145 128 180 120 200 Z" fill="url(#selada-daun-gelap)"/>
    <!-- Daun belakang atas tengah -->
    <path d="M120 200 C95 160 85 110 98 75 C108 52 132 52 142 75 C155 110 145 160 120 200 Z" fill="url(#selada-daun-gelap)"/>
  </g>

  <!-- Kelopak selada lapisan tengah (keriting bergelombang) -->
  <g filter="url(#selada-halus)">
    <!-- Daun tengah kiri bergelombang -->
    <path d="M120 200 C85 190 60 170 55 140 C52 120 62 108 76 106 C84 105 88 112 94 110 C100 108 104 98 114 100 C118 102 120 108 120 118 C102 148 108 182 120 200 Z" fill="url(#selada-daun-sedang)"/>
    <!-- Daun tengah kanan bergelombang -->
    <path d="M120 200 C155 190 180 170 185 140 C188 120 178 108 164 106 C156 105 152 112 146 110 C140 108 136 98 126 100 C122 102 120 108 120 118 C138 148 132 182 120 200 Z" fill="url(#selada-daun-sedang)"/>
    <!-- Daun tengah atas -->
    <path d="M120 200 C100 170 92 130 102 96 C108 78 120 76 128 82 C134 86 136 78 142 82 C148 86 146 100 140 112 C132 142 130 175 120 200 Z" fill="url(#selada-daun-sedang)"/>
  </g>

  <!-- Kelopak selada depan dan inti rimbun -->
  <g filter="url(#selada-halus)">
    <!-- Daun depan kiri cembung -->
    <path d="M120 202 C90 196 72 178 68 152 C65 132 75 122 88 122 C96 122 98 130 106 128 C112 126 114 118 120 120 C110 146 112 180 120 202 Z" fill="url(#selada-daun-terang)"/>
    <!-- Daun depan kanan cembung -->
    <path d="M120 202 C150 196 168 178 172 152 C175 132 165 122 152 122 C144 122 142 130 134 128 C128 126 126 118 120 120 C130 146 128 180 120 202 Z" fill="url(#selada-daun-terang)"/>
    <!-- Daun depan bawah tengah keriting -->
    <path d="M120 204 C104 192 98 174 102 150 C106 134 114 130 120 134 C126 130 134 134 138 150 C142 174 136 192 120 204 Z" fill="url(#selada-daun-terang)"/>
  </g>

  <!-- Tulang daun dan pendaran cahaya (highlights) -->
  <path d="M120 204 C116 180 112 156 120 138" stroke="#F4FFDE" stroke-width="3" stroke-linecap="round" fill="none" opacity=".85"/>
  <path d="M120 204 C105 186 92 168 88 148" stroke="#F4FFDE" stroke-width="2.2" stroke-linecap="round" fill="none" opacity=".7"/>
  <path d="M120 204 C135 186 148 168 152 148" stroke="#F4FFDE" stroke-width="2.2" stroke-linecap="round" fill="none" opacity=".7"/>

  <!-- Tekstur lekukan tepi keriting selada -->
  <path d="M68 152 C72 146 76 150 80 144 C84 138 90 142 94 136" stroke="#C9FF75" stroke-width="1.8" stroke-linecap="round" fill="none" opacity=".8"/>
  <path d="M172 152 C168 146 164 150 160 144 C156 138 150 142 146 136" stroke="#C9FF75" stroke-width="1.8" stroke-linecap="round" fill="none" opacity=".8"/>

  <!-- Pangkal batang selada putih kehijauan segar -->
  <path d="M112 205 C112 201 116 195 120 195 C124 195 128 201 128 205 C128 208 124 210 120 210 C116 210 112 208 112 205 Z" fill="url(#selada-pangkal)"/>
</svg>
