<!doctype html>
<html lang="id" data-animasi="%VITE_ANIMASI%">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Tani Muda: belajar menanam, menghitung modal, merawat dengan pengingat, dan menjual panen."
    />
    <link
      rel="preload"
      href="/fonts/outfit-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#86C232" />
    <meta name="apple-mobile-web-app-title" content="Tani Muda" />
    <title>Tani Muda</title>
    <!-- Layar memuat muat pertama [AG-55]: SVG dan CSS sebaris supaya tampil sebelum bundel
         JavaScript selesai dimuat; dihapus src/lib/layar-memuat.ts dengan transisi memudar.
         Animasi tunas sama dengan public/ilustrasi/memuat-tunas.svg. -->
    <style>
      @font-face { font-family: 'Outfit'; src: url('/fonts/outfit-latin.woff2') format('woff2'); font-weight: 100 900; font-display: swap; }
      #layar-memuat { position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; background: #F7F8FA; transition: opacity .3s cubic-bezier(.16,1,.3,1); }
      #layar-memuat.pudar { opacity: 0; }
      #layar-memuat svg { width: 96px; height: 96px; }
      #layar-memuat .batang { transform-box: view-box; transform-origin: 48px 74px; animation: lm-tumbuh 1.8s cubic-bezier(.2,.8,.2,1) infinite; }
      #layar-memuat .daun-kiri { transform-box: view-box; transform-origin: 48px 50px; animation: lm-kiri 1.8s cubic-bezier(.2,.8,.2,1) infinite; }
      #layar-memuat .daun-kanan { transform-box: view-box; transform-origin: 48px 48px; animation: lm-kanan 1.8s cubic-bezier(.2,.8,.2,1) infinite; }
      #layar-memuat .tanah { transform-box: view-box; transform-origin: 48px 76px; animation: lm-denyut-tanah 1.8s ease-in-out infinite; }
      #layar-memuat .nama { margin: 0; font: 600 28px/36px 'Outfit', system-ui, 'Segoe UI', sans-serif; color: #3D6B0E; letter-spacing: -0.01em; animation: lm-denyut 1.6s ease-in-out .9s infinite; }
      #layar-memuat .nama span { display: inline-block; white-space: pre; animation: lm-huruf .5s cubic-bezier(.16,1,.3,1) both; }
      @keyframes lm-tumbuh { 0% { transform: scaleY(0); } 35%, 85% { transform: scaleY(1); opacity: 1; } 100% { transform: scaleY(1); opacity: 0; } }
      @keyframes lm-kiri { 0%, 25% { transform: rotate(40deg) scale(0); } 55%, 85% { transform: rotate(0) scale(1); opacity: 1; } 100% { transform: rotate(0) scale(1); opacity: 0; } }
      @keyframes lm-kanan { 0%, 32% { transform: rotate(-40deg) scale(0); } 62%, 85% { transform: rotate(0) scale(1); opacity: 1; } 100% { transform: rotate(0) scale(1); opacity: 0; } }
      @keyframes lm-denyut-tanah { 0%, 100% { transform: scaleX(.9); } 50% { transform: scaleX(1.05); } }
      @keyframes lm-huruf { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
      @keyframes lm-denyut { 0%, 100% { opacity: 1; } 50% { opacity: .6; } }
      @media (prefers-reduced-motion: reduce) { #layar-memuat, #layar-memuat * { animation: none !important; transition: none !important; } }
      html[data-animasi='mati'] #layar-memuat, html[data-animasi='mati'] #layar-memuat * { animation: none !important; transition: none !important; }
    </style>
  </head>
  <body>
    <script>
      // Halaman depan selalu dibuka dari hero [AG-56]: matikan pemulihan posisi gulir otomatis
      // peramban sebelum bundel dimuat (muat ulang tidak melompat ke posisi lama).
      if (location.pathname === '/' && 'scrollRestoration' in history) history.scrollRestoration = 'manual';
    </script>
    <div id="layar-memuat" role="status" aria-label="Memuat Tani Muda">
      <svg viewBox="0 0 96 96" aria-hidden="true">
        <defs>
        <linearGradient id="lm-daun" x1="0" y1="1" x2=".4" y2="0"><stop offset="0" stop-color="#3E9B1F"/><stop offset=".55" stop-color="#7CCB2B"/><stop offset="1" stop-color="#C9F23E"/></linearGradient>
        <radialGradient id="lm-tanah" cx="50%" cy="40%" r="60%"><stop offset="0" stop-color="#A86A42"/><stop offset="1" stop-color="#6B3C22"/></radialGradient>
        </defs>
        <ellipse class="tanah" cx="48" cy="77" rx="22" ry="6" fill="url(#lm-tanah)"/>
        <path class="batang" d="M48 76 C48 66 48 58 48 48" stroke="#5FAE34" stroke-width="4" stroke-linecap="round" fill="none"/>
        <g class="daun-kiri">
        <path d="M47 51 C40 38 24 36 18 44 C25 55 38 56 47 51 Z" fill="url(#lm-daun)"/>
        <path d="M44 50 C37 46 30 45 24 46" stroke="#fff" stroke-opacity=".45" stroke-width="2" fill="none" stroke-linecap="round"/>
        </g>
        <g class="daun-kanan">
        <path d="M49 49 C55 33 72 29 79 37 C73 50 59 53 49 49 Z" fill="url(#lm-daun)"/>
        <path d="M52 47 C59 42 66 40 72 40" stroke="#fff" stroke-opacity=".45" stroke-width="2" fill="none" stroke-linecap="round"/>
        </g>
      </svg>
      <p class="nama" aria-hidden="true"><span style="animation-delay:0ms">T</span><span style="animation-delay:60ms">a</span><span style="animation-delay:120ms">n</span><span style="animation-delay:180ms">i</span><span style="animation-delay:240ms"> </span><span style="animation-delay:300ms">M</span><span style="animation-delay:360ms">u</span><span style="animation-delay:420ms">d</span><span style="animation-delay:480ms">a</span></p>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
